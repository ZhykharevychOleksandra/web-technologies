<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №5 - Завдання 1</title>
    <link rel="stylesheet" href="style_1.css">
</head>
<body>

    <!-- Синій пунктир на схемі (div) -->
    <div class="main-container">
        <!-- Жовтий пунктир (h1) -->
        <h1>План подорожі:</h1>
        
        <!-- Помаранчевий пунктир (ul 1-го рівня) -->
        <ul class="ul-level-1">
            
            <!-- Синій прямокутник (li 1-го рівня) -->
            <li class="li-main">
                <!-- Рожевий пунктир (span 1-го рівня) -->
                <span class="span-l1">Підготовчий етап</span>
                
                <!-- Синій пунктир (ul 2-го рівня) -->
                <ul class="ul-level-2">
                    <!-- Синій прямокутник (li 2-го рівня) з рожевим span всередині -->
                    <li class="route"><span class="span-l2">Обрати маршрут</span></li>
                    <li class="tickets"><span class="span-l2">Квитки на літак</span></li>
                    <li class="hotel"><span class="span-l2">Готель</span></li>
                    <li class="car"><span class="span-l2">Оренда авто</span></li>
                </ul>
            </li>
            
            <!-- Другий li 1-го рівня -->
            <li class="li-main">
                <span class="span-l1">Відпочинок</span>
                
                <ul class="ul-level-2">
                    <li class="bars"><span class="span-l2">Бари</span></li>
                    <li class="casino"><span class="span-l2">Казино</span></li>
                    <li class="museums"><span class="span-l2">Музеї</span></li>
                    <li class="festivals"><span class="span-l2">Фестивалі</span></li>
                </ul>
            </li>

        </ul>
    </div>

</body>
</html>
