<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота 6 - Завдання 5</title>
    <link rel="stylesheet" href="style_5.css">
</head>
<body>

    <!-- Головне сіре вікно-контейнер (як на макеті) -->
    <div class="weather-widget-container">
        
        <!-- Кнопки навігації слайдера -->
        <div class="slider-arrows">
            <button class="arrow-btn">&larr;</button>
            <button class="arrow-btn">&rarr;</button>
        </div>

        <!-- Головна чорна картка (передній шар) -->
        <div class="main-weather-card">
            <div class="current-temp">17</div>
            
            <!-- Реалістична CSS-хмаринка -->
            <div class="css-cloud">
                <div class="cloud-part part-1"></div>
                <div class="cloud-part part-2"></div>
                <div class="cloud-part part-3"></div>
            </div>
        </div>

        <!-- Задній шар: Прогноз на тиждень -->
        <div class="forecast-panel">
            <div class="forecast-days">
                <div class="day-col"><span>Mon</span><strong>17°</strong></div>
                <div class="day-col"><span>Tue</span><strong>19°</strong></div>
                <div class="day-col"><span>Wed</span><strong>16°</strong></div>
                <div class="day-col"><span>Thu</span><strong>18°</strong></div>
                <div class="day-col"><span>Fri</span><strong>21°</strong></div>
            </div>
        </div>

    </div>

</body>
</html>
