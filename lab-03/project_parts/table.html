<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 1: Таблиця</title>
</head>
<body>

    <div style="text-align: center; margin-top: 30px;">
        <h1>Приклад структурованої таблиці</h1>
        
        <!-- таблиця з рамкою 2px та кольором комірок -->
        <table border="2" bordercolor="#000000" cellpadding="10" cellspacing="0" style="margin: 0 auto; background-color: #f0f8ff;">
            <thead>
                <tr style="background-color: #b0c4de;">
                    <th>№</th>
                    <th>Назва предмета</th>
                    <th>Кількість годин</th>
                    <th>Тип контролю</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>Веб-технології</td>
                    <td>120</td>
                    <td>Іспит</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Вища математика</td>
                    <td>90</td>
                    <td>Залік</td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>Дискретна математика</td>
                    <td>100</td>
                    <td>Іспит</td>
                </tr>
            </tbody>
        </table>

        <br><br>
        <p><a href="../index.html">Повернутись на головну</a></p>
    </div>

</body>
</html>
