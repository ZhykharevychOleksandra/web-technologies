<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Хімічні та математичні формули</title>
</head>
<body>

    <h1>Хімічні та математичні формули</h1>

    <ol>
        <li>
            <em>Формула реакції горіння метану:</em><br>
            CH<sub>4</sub> + 2O<sub>2</sub> &rarr; CO<sub>2</sub> + 2H<sub>2</sub>O
        </li>
        <li>
            <em>Теорема Піфагора:</em><br>
            a<sup>2</sup> + b<sup>2</sup> = c<sup>2</sup>
        </li>
        <li>
            <em>Формула глюкози:</em><br>
            C<sub>6</sub>H<sub>12</sub>O<sub>6</sub>
        </li>
        <li>
            <em>Квадратне рівняння (загальний вигляд):</em><br>
            ax<sup>2</sup> + bx + c = 0
        </li>
        <li>
            <em>Формула сульфатної кислоти:</em><br>
            H<sub>2</sub>SO<sub>4</sub>
        </li>
    </ol>

</body>
</html>
